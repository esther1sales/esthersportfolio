<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esther's Portfolio</title>
  <link rel="prefetch" href="main.html">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #c61e3b;
      opacity: 1;
      transition: opacity 0.18s ease;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" height="32" width="32" viewBox="0 0 32 32"><polygon points="0,0 32,16 0,32" fill="white"/></svg>') 0 0, auto;
    }

    body.leaving {
      opacity: 0;
    }

    .logo-container {
      position: relative;
      display: block;
      padding: 40px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-container img {
      display: block;
      width: 80vw;
      max-width: 300px;
      height: auto;
      transform: scale(1);
      transition: transform 0.42s ease;
    }

    .logo-container.animate img {
      transform: scale(1.04);
    }

    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .line {
      position: absolute;
      background-color: #fdf1dd;
      transition: transform 0.42s ease;
      pointer-events: none;
    }

    .line-top,
    .line-bottom {
      left: 0;
      width: 100%;
      height: 2px;
      transform: scaleX(0);
    }

    .line-top {
      top: 0;
      transform-origin: left;
    }

    .line-bottom {
      bottom: 0;
      transform-origin: right;
    }

    .line-left,
    .line-right {
      top: 0;
      width: 2px;
      height: 100%;
      transform: scaleY(0);
    }

    .line-left {
      left: 0;
      transform-origin: bottom;
    }

    .line-right {
      right: 0;
      transform-origin: top;
    }

    .logo-container.animate .line-top,
    .logo-container.animate .line-bottom {
      transform: scaleX(1);
    }

    .logo-container.animate .line-left,
    .logo-container.animate .line-right {
      transform: scaleY(1);
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .logo-container img,
      .line {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="logo-container" id="introLink" href="main.html" aria-label="Enter Esther Sales portfolio">
    <img src="logos/mylogocream.png" alt="Esther Sales Logo">
    <span class="lines" aria-hidden="true">
      <span class="line line-top"></span>
      <span class="line line-bottom"></span>
      <span class="line line-left"></span>
      <span class="line line-right"></span>
    </span>
  </a>

  <script>
    const introLink = document.getElementById("introLink");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduceMotion) {
      window.setTimeout(() => {
        window.location.replace("main.html");
      }, 120);
    } else {
      window.setTimeout(() => {
        introLink.classList.add("animate");
      }, 70);

      window.setTimeout(() => {
        document.body.classList.add("leaving");
      }, 780);

      window.setTimeout(() => {
        window.location.replace("main.html");
      }, 980);
    }
  </script>
</body>
</html>
