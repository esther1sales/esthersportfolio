   @font-face {
  font-family: 'ABCDiatype';
  src: url('culturalfingerprints/ABCDiatypeSemi-Mono-Light.woff') format('woff');
  font-weight: 300;
  font-style: normal;
}

@font-face {
  font-family: 'ABCDiatype';
  src: url('culturalfingerprints/ABCDiatypeSemi-Mono-Regular.woff') format('woff');
  font-weight: 400;
  font-style: normal;
}

@font-face {

}
    
    html {
      font-size: calc(100vw / 1920 * 16); /* 16px on 1920px screen, scales proportionally */
    }
    
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: rgb(255, 191, 0);
      overflow: hidden;
      font-family: 'ABCDiatype', sans-serif;
      font-weight: 400;
      position: relative;
    }
    
    /* Proportional title and subtitle */
    .title {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: black;
      font-size: 4rem; /* base on html font-size */
      z-index: 2;
      text-align: center;
      pointer-events: none;
      font-family: 'ABCDiatype', sans-serif;
      font-weight: 800;
    }
    
    .subtitle {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: black;
      font-size: 1.5rem;
      z-index: 2;
      text-align: center;
      pointer-events: none;
    }
    
    /* Tag box remains proportionate */
    .tag-box {
      display: inline-block;
      background-color: black;
      color: rgb(255, 191, 0);
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      font-size: 1rem;
    }
    
    /* Top link proportional */
    .top-right-link {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      color: black;
      text-decoration: underline;
      font-size: 1rem;
      z-index: 3;
      transition: color 0.3s ease;
    }
    .top-right-link:hover {
      color: rgb(255, 0, 102);
    }
    
    /* Square image scales proportionally */
    #dvd-square {
      position: absolute;
      width: 18.75rem;  /* 300px at base scale */
      height: 11.25rem; /* 180px at base scale */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 4;
      border: 2px solid rgb(255, 191, 0);
      border-radius: 0.5rem;
    }
    </style>
    
    
</head>

    let preloadedImages = [];
    let imageIndex = 0;
    let x = 100;
    let y = 100;
    let dx = 3;
    let dy = 2.2;
    function getSquareSize() {
  const rect = square.getBoundingClientRect();
  return {
    width: rect.width,
    height: rect.height
  };
}

  function getTagFromImage(imagePath) {
  const parts = imagePath.split('/');
  const tag = parts.length >= 3 ? parts[2] : "unknown";
  return tag.replace(/_/g, " ");
}

 
    function changeImage() {
  if (preloadedImages.length === 0) return;
  imageIndex = (imageIndex + 1) % preloadedImages.length;
  const currentImage = preloadedImages[imageIndex];
  square.style.backgroundImage = `url('${currentImage}')`;
  const tag = getTagFromImage(currentImage);
  subtitle.innerHTML = `Cultural Fingerprints: <span class="tag-box">${tag}</span>`;
}


    function updatePosition() {
  const windowWidth = window.innerWidth;
  const windowHeight = window.innerHeight;
  const { width, height } = getSquareSize();

  x += dx;
  y += dy;

  if (x + width >= windowWidth) {
    x = windowWidth - width;
    dx = -Math.abs(dx);
    changeImage();
  }

  if (x <= 0) {
    x = 0;
    dx = Math.abs(dx);
    changeImage();
  }

  if (y + height >= windowHeight) {
    y = windowHeight - height;
    dy = -Math.abs(dy);
    changeImage();
  }

  if (y <= 0) {
    y = 0;
    dy = Math.abs(dy);
    changeImage();
  }

  square.style.left = `${x}px`;
  square.style.top = `${y}px`;

  requestAnimationFrame(updatePosition);
}
window.addEventListener("resize", () => {
  const { width, height } = getSquareSize();
  x = Math.min(x, window.innerWidth - width);
  y = Math.min(y, window.innerHeight - height);
});
    preloadImages(images);
    const initialTag = getTagFromImage(images[imageIndex]);
    subtitle.innerHTML = `Cultural Fingerprints: <span class="tag-box">${initialTag}</span>`;
    square.style.backgroundImage = `url('${images[imageIndex]}')`;
    updatePosition();

    function preloadImages(urls) {
  urls.forEach((url) => {
    const img = new Image();
    img.onload = () => preloadedImages.push(url);
    img.onerror = () => console.warn(`Image failed to load: ${url}`);
    img.src = url;
  });
}
